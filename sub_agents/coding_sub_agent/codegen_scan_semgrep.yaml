# codegen_scan_semgrep.yaml
# Complete semgrep rules for LLM generated code sandbox
# Tabular I/O: only pd.read_* / df.to_* with bare .csv / .xlsx string literals
# Plot I/O:    only plt.savefig / Figure.savefig with bare .png / .svg string literals
# Do not use pipeline_run.py as a data/plot path (tool-managed runner)
# Everything else blocked

rules:

  # ── BLOCK OS ──────────────────────────────────────────────────────────────

  - id: block-os
    pattern-either:
      - pattern: import os
      - pattern: from os import $X
    message: "os not allowed"
    languages: [python]
    severity: ERROR

  # ── BLOCK OS BYPASSES (posix/nt/etc. — same privileges without ``import os``)

  - id: block-os-alternatives
    pattern-either:
      - pattern: import posix
      - pattern: from posix import $X
      - pattern: import nt
      - pattern: from nt import $X
      - pattern: import pwd
      - pattern: from pwd import $X
      - pattern: import grp
      - pattern: from grp import $X
      - pattern: import spwd
      - pattern: from spwd import $X
      - pattern: import fcntl
      - pattern: from fcntl import $X
      - pattern: import termios
      - pattern: from termios import $X
      - pattern: import msilib
      - pattern: from msilib import $X
      - pattern: import winreg
      - pattern: from winreg import $X
      - pattern: import _winapi
      - pattern: from _winapi import $X
    message: "low-level OS modules not allowed (posix/nt/winreg/...)"
    languages: [python]
    severity: ERROR

  # ── BLOCK ENV / PROCESS ENV (secrets, API keys, config exfil) ─────────────

  - id: block-environment-access
    pattern-either:
      - pattern: os.environ
      - pattern: os.environ[...]
      - pattern: os.getenv(...)
      - pattern: os.putenv(...)
      - pattern: os.unsetenv(...)
      - pattern: sys.environ
      - pattern: posix.environ
    message: "environment access not allowed"
    languages: [python]
    severity: ERROR

  # ── BLOCK PYTHON-DOTENV (loads .env into os.environ) ─────────────────────

  - id: block-dotenv
    pattern-either:
      - pattern: import dotenv
      - pattern: from dotenv import $X
      - pattern: load_dotenv(...)
      - pattern: dotenv.load_dotenv(...)
    message: "dotenv not allowed — no reading .env / environment"
    languages: [python]
    severity: ERROR

  # ── BLOCK SUBPROCESS ──────────────────────────────────────────────────────

  - id: block-subprocess
    pattern-either:
      - pattern: import subprocess
      - pattern: from subprocess import $X
    message: "subprocess not allowed"
    languages: [python]
    severity: ERROR

  # ── BLOCK SUBPROCESS CALLS + OS SPAWN/EXEC (run other scripts / binaries) ─

  - id: block-subprocess-os-exec-calls
    pattern-either:
      - pattern: subprocess.run(...)
      - pattern: subprocess.Popen(...)
      - pattern: subprocess.call(...)
      - pattern: subprocess.check_call(...)
      - pattern: subprocess.check_output(...)
      - pattern: os.system(...)
      - pattern: os.popen(...)
      - pattern: os.posix_spawn(...)
      - pattern: os.spawnv(...)
      - pattern: os.spawnve(...)
      - pattern: os.spawnvp(...)
      - pattern: os.spawnvpe(...)
      - pattern: os.spawnl(...)
      - pattern: os.spawnle(...)
      - pattern: os.spawnlp(...)
      - pattern: os.spawnlpe(...)
      - pattern: os.execv(...)
      - pattern: os.execve(...)
      - pattern: os.execl(...)
      - pattern: os.execle(...)
      - pattern: os.execlp(...)
      - pattern: os.execvp(...)
      - pattern: os.execvpe(...)
      - pattern: os.startfile(...)
      - pattern: posix.system(...)
    message: "cannot spawn subprocess or shell — no other scripts/binaries"
    languages: [python]
    severity: ERROR

  # ── BLOCK SHUTIL ──────────────────────────────────────────────────────────

  - id: block-shutil
    pattern-either:
      - pattern: import shutil
      - pattern: from shutil import $X
    message: "shutil not allowed"
    languages: [python]
    severity: ERROR

  # ── BLOCK PATHLIB ─────────────────────────────────────────────────────────

  - id: block-pathlib
    pattern-either:
      - pattern: import pathlib
      - pattern: from pathlib import $X
    message: "pathlib not allowed"
    languages: [python]
    severity: ERROR

  # ── BLOCK IO ──────────────────────────────────────────────────────────────

  - id: block-io
    pattern-either:
      - pattern: import io
      - pattern: from io import $X
    message: "io not allowed"
    languages: [python]
    severity: ERROR

  # ── BLOCK GLOB ────────────────────────────────────────────────────────────

  - id: block-glob
    pattern-either:
      - pattern: import glob
      - pattern: from glob import $X
      - pattern: glob.glob($X, ...)
      - pattern: glob.iglob($X, ...)
    message: "glob not allowed"
    languages: [python]
    severity: ERROR

  # ── BLOCK TEMPFILE ────────────────────────────────────────────────────────

  - id: block-tempfile
    pattern-either:
      - pattern: import tempfile
      - pattern: from tempfile import $X
    message: "tempfile not allowed"
    languages: [python]
    severity: ERROR

  # ── BLOCK SYS ─────────────────────────────────────────────────────────────

  - id: block-sys
    pattern-either:
      - pattern: import sys
      - pattern: from sys import $X
    message: "sys not allowed"
    languages: [python]
    severity: ERROR

  # ── BLOCK CTYPES / CFFI ───────────────────────────────────────────────────

  - id: block-ctypes-cffi
    pattern-either:
      - pattern: import ctypes
      - pattern: from ctypes import $X
      - pattern: import cffi
      - pattern: from cffi import $X
    message: "ctypes/cffi not allowed"
    languages: [python]
    severity: ERROR

  # ── BLOCK MMAP ────────────────────────────────────────────────────────────

  - id: block-mmap
    pattern-either:
      - pattern: import mmap
      - pattern: from mmap import $X
    message: "mmap not allowed"
    languages: [python]
    severity: ERROR

  # ── BLOCK AST ─────────────────────────────────────────────────────────────

  - id: block-ast
    pattern-either:
      - pattern: import ast
      - pattern: from ast import $X
    message: "ast not allowed"
    languages: [python]
    severity: ERROR

  # ── BLOCK INSPECT ─────────────────────────────────────────────────────────

  - id: block-inspect
    pattern-either:
      - pattern: import inspect
      - pattern: from inspect import $X
    message: "inspect not allowed"
    languages: [python]
    severity: ERROR

  # ── BLOCK GC ──────────────────────────────────────────────────────────────

  - id: block-gc
    pattern-either:
      - pattern: import gc
      - pattern: from gc import $X
    message: "gc not allowed"
    languages: [python]
    severity: ERROR

  # ── BLOCK LINECACHE / TRACEBACK ───────────────────────────────────────────

  - id: block-linecache-traceback
    pattern-either:
      - pattern: import linecache
      - pattern: from linecache import $X
      - pattern: import traceback
      - pattern: from traceback import $X
    message: "linecache/traceback not allowed"
    languages: [python]
    severity: ERROR

  # ── BLOCK SIGNAL / RESOURCE ───────────────────────────────────────────────

  - id: block-signal-resource
    pattern-either:
      - pattern: import signal
      - pattern: from signal import $X
      - pattern: import resource
      - pattern: from resource import $X
    message: "signal/resource not allowed"
    languages: [python]
    severity: ERROR

  # ── BLOCK WARNINGS ────────────────────────────────────────────────────────

  - id: block-warnings
    pattern-either:
      - pattern: import warnings
      - pattern: warnings.filterwarnings(...)
      - pattern: warnings.simplefilter(...)
    message: "warnings not allowed"
    languages: [python]
    severity: ERROR

  # ── BLOCK PLATFORM / SYSCONFIG / SITE ────────────────────────────────────

  - id: block-recon
    pattern-either:
      - pattern: import platform
      - pattern: from platform import $X
      - pattern: import sysconfig
      - pattern: from sysconfig import $X
      - pattern: import site
      - pattern: from site import $X
    message: "system recon not allowed"
    languages: [python]
    severity: ERROR

  # ── BLOCK DEBUGGERS ───────────────────────────────────────────────────────

  - id: block-debuggers
    pattern-either:
      - pattern: import pdb
      - pattern: from pdb import $X
      - pattern: import faulthandler
      - pattern: from faulthandler import $X
      - pattern: import code
      - pattern: from code import $X
      - pattern: import codeop
      - pattern: from codeop import $X
      - pattern: pdb.set_trace()
      - pattern: breakpoint()
    message: "debuggers not allowed"
    languages: [python]
    severity: ERROR

  # ── BLOCK TERMINAL ────────────────────────────────────────────────────────

  - id: block-terminal
    pattern-either:
      - pattern: import pty
      - pattern: from pty import $X
      - pattern: import tty
      - pattern: from tty import $X
      - pattern: pty.spawn($X)
    message: "terminal access not allowed"
    languages: [python]
    severity: ERROR

  # ── BLOCK NETWORK ─────────────────────────────────────────────────────────

  - id: block-network
    pattern-either:
      - pattern: import requests
      - pattern: from requests import $X
      - pattern: import urllib
      - pattern: from urllib import $X
      - pattern: import socket
      - pattern: from socket import $X
      - pattern: import httpx
      - pattern: from httpx import $X
      - pattern: import aiohttp
      - pattern: from aiohttp import $X
      - pattern: import smtplib
      - pattern: from smtplib import $X
      - pattern: import ftplib
      - pattern: from ftplib import $X
      - pattern: import paramiko
      - pattern: from paramiko import $X
      - pattern: import boto3
      - pattern: from boto3 import $X
    message: "network not allowed"
    languages: [python]
    severity: ERROR

  # ── BLOCK URLLIB SUBMODULES (bypasses ``import urllib`` alone) ───────────

  - id: block-urllib-submodules
    pattern-either:
      - pattern: import urllib.request
      - pattern: from urllib.request import $X
      - pattern: import urllib.response
      - pattern: from urllib.response import $X
      - pattern: import urllib.error
      - pattern: from urllib.error import $X
      - pattern: import urllib.robotparser
      - pattern: from urllib.robotparser import $X
    message: "urllib submodules not allowed — use pandas read_csv/read_excel/to_csv/to_excel with local .csv/.xlsx paths only"
    languages: [python]
    severity: ERROR

  # ── BLOCK HTTP CLIENT CALL SHAPES (defense in depth if imports are evaded) ─

  - id: block-http-client-calls
    pattern-either:
      - pattern: requests.get(...)
      - pattern: requests.post(...)
      - pattern: requests.put(...)
      - pattern: requests.delete(...)
      - pattern: requests.head(...)
      - pattern: requests.patch(...)
      - pattern: requests.request(...)
      - pattern: requests.Session(...)
      - pattern: httpx.get(...)
      - pattern: httpx.post(...)
      - pattern: httpx.request(...)
      - pattern: httpx.stream(...)
      - pattern: httpx.Client(...)
      - pattern: aiohttp.ClientSession(...)
      - pattern: urllib.request.urlopen(...)
    message: "HTTP client calls not allowed"
    languages: [python]
    severity: ERROR

  # ── BLOCK HTTP.SERVER / SOCKETSERVER (listen/bind — beyond raw socket import) ─

  - id: block-http-serving-socketserver
    pattern-either:
      - pattern: import http.server
      - pattern: from http import server
      - pattern: from http import server as $X
      - pattern: from http.server import $X
      - pattern: import socketserver
      - pattern: from socketserver import $X
      - pattern: http.server.HTTPServer(...)
      - pattern: http.server.ThreadingHTTPServer(...)
      - pattern: http.server.BaseHTTPRequestHandler
      - pattern: http.server.SimpleHTTPRequestHandler
      - pattern: http.server.CGIHTTPRequestHandler
      - pattern: socketserver.TCPServer(...)
      - pattern: socketserver.UDPServer(...)
      - pattern: socketserver.ThreadingTCPServer(...)
      - pattern: socketserver.ForkingTCPServer(...)
      - pattern: socketserver.UnixStreamServer(...)
      - pattern: socketserver.UnixDatagramServer(...)
    message: "HTTP serving / socketserver not allowed"
    languages: [python]
    severity: ERROR

  # ── BLOCK EXTENDED NETWORK ────────────────────────────────────────────────

  - id: block-network-extended
    pattern-either:
      - pattern: import http
      - pattern: from http import $X
      - pattern: import http.client
      - pattern: from http.client import $X
      - pattern: import xmlrpc
      - pattern: from xmlrpc import $X
      - pattern: import xmlrpc.client
      - pattern: from xmlrpc.client import $X
      - pattern: import imaplib
      - pattern: from imaplib import $X
      - pattern: import poplib
      - pattern: from poplib import $X
      - pattern: import telnetlib
      - pattern: from telnetlib import $X
      - pattern: import nntplib
      - pattern: from nntplib import $X
      - pattern: import asyncio
      - pattern: from asyncio import $X
      - pattern: import ssl
      - pattern: from ssl import $X
      - pattern: import pycurl
      - pattern: from pycurl import $X
      - pattern: import websocket
      - pattern: from websocket import $X
      - pattern: import websockets
      - pattern: from websockets import $X
      - pattern: import grpc
      - pattern: from grpc import $X
      - pattern: import twilio
      - pattern: from twilio import $X
      - pattern: import sendgrid
      - pattern: from sendgrid import $X
      - pattern: import firebase_admin
      - pattern: from firebase_admin import $X
      - pattern: import supabase
      - pattern: from supabase import $X
      - pattern: import antigravity
      - pattern: import httplib2
      - pattern: from httplib2 import $X
      - pattern: import tornado
      - pattern: from tornado import $X
      - pattern: import twisted
      - pattern: from twisted import $X
      - pattern: import zmq
      - pattern: from zmq import $X
      - pattern: import pika
      - pattern: from pika import $X
      - pattern: import kafka
      - pattern: from kafka import $X
      - pattern: import celery
      - pattern: from celery import $X
      - pattern: import nats
      - pattern: from nats import $X
      - pattern: import redis
      - pattern: from redis import $X
      - pattern: import pymongo
      - pattern: from pymongo import $X
      - pattern: import elasticsearch
      - pattern: from elasticsearch import $X
      - pattern: import httpcore
      - pattern: from httpcore import $X
      - pattern: import starlette
      - pattern: from starlette import $X
      - pattern: import fastapi
      - pattern: from fastapi import $X
      - pattern: import flask
      - pattern: from flask import $X
      - pattern: import django
      - pattern: from django import $X
    message: "network/API calls not allowed"
    languages: [python]
    severity: ERROR

  # ── BLOCK CODE EXECUTION ──────────────────────────────────────────────────

  - id: block-eval-exec
    pattern-either:
      - pattern: eval($X)
      - pattern: exec($X)
      - pattern: compile($X, ...)
    message: "eval/exec/compile not allowed"
    languages: [python]
    severity: ERROR

  # ── BLOCK DYNAMIC IMPORTS ─────────────────────────────────────────────────

  - id: block-dynamic-imports
    pattern-either:
      - pattern: import importlib
      - pattern: import importlib.util
      - pattern: import importlib.machinery
      - pattern: import importlib.abc
      - pattern: from importlib import $X
      - pattern: from importlib.util import $X
      - pattern: from importlib.machinery import $X
      - pattern: importlib.util.spec_from_file_location(...)
      - pattern: importlib.util.module_from_spec(...)
      - pattern: import imp
      - pattern: from imp import $X
      - pattern: __import__($X)
      - pattern: importlib.import_module(...)
    message: "dynamic imports not allowed — no loading other .py files"
    languages: [python]
    severity: ERROR

  # ── BLOCK CONCURRENT.FUTURES (threads / process pools — bypass process ban) ─

  - id: block-concurrent-futures
    pattern-either:
      - pattern: import concurrent
      - pattern: import concurrent.futures
      - pattern: from concurrent import $X
      - pattern: from concurrent.futures import $X
    message: "concurrent.futures not allowed — no thread/process pools"
    languages: [python]
    severity: ERROR

  # ── BLOCK SERIALIZATION ───────────────────────────────────────────────────

  - id: block-serialization
    pattern-either:
      - pattern: import pickle
      - pattern: from pickle import $X
      - pattern: import shelve
      - pattern: from shelve import $X
      - pattern: import marshal
      - pattern: from marshal import $X
      - pattern: import dill
      - pattern: from dill import $X
      - pattern: import cloudpickle
      - pattern: from cloudpickle import $X
    message: "serialization not allowed"
    languages: [python]
    severity: ERROR

  # ── BLOCK JOBLIB (sklearn-style persistence; pickle risk) ─────────────────

  - id: block-joblib
    pattern-either:
      - pattern: import joblib
      - pattern: from joblib import $X
      - pattern: joblib.dump(...)
      - pattern: joblib.load(...)
    message: "joblib not allowed"
    languages: [python]
    severity: ERROR

  # ── BLOCK PROCESS CONTROL ─────────────────────────────────────────────────

  - id: block-process-control
    pattern-either:
      - pattern: import multiprocessing
      - pattern: from multiprocessing import $X
      - pattern: import threading
      - pattern: from threading import $X
    message: "process control not allowed"
    languages: [python]
    severity: ERROR

  # ── BLOCK GIT ─────────────────────────────────────────────────────────────

  - id: block-git
    pattern-either:
      - pattern: import git
      - pattern: from git import $X
      - pattern: import github
      - pattern: from github import $X
      - pattern: import gitlab
      - pattern: from gitlab import $X
      - pattern: import pygit2
      - pattern: from pygit2 import $X
      - pattern: import dulwich
      - pattern: from dulwich import $X
    message: "git / GitPython / pygit2 / dulwich not allowed"
    languages: [python]
    severity: ERROR

  # ── BLOCK PIP ─────────────────────────────────────────────────────────────

  - id: block-pip
    pattern-either:
      - pattern: import pip
      - pattern: from pip import $X
      - pattern: from pip._internal import $X
      - pattern: pip.main(...)
      - pattern: pip._internal.main(...)
    message: "pip not allowed (including pip.main / pip._internal)"
    languages: [python]
    severity: ERROR

  # ── BLOCK BASE64 ──────────────────────────────────────────────────────────

  - id: block-base64
    pattern-either:
      - pattern: import base64
      - pattern: from base64 import $X
      - pattern: base64.b64decode($X)
      - pattern: base64.b64encode($X)
    message: "base64 not allowed"
    languages: [python]
    severity: ERROR

  # ── BLOCK CSV / JSON ──────────────────────────────────────────────────────

  - id: block-csv-json
    pattern-either:
      - pattern: import csv
      - pattern: from csv import $X
      - pattern: import json
      - pattern: from json import $X
    message: "csv/json not allowed — use pandas only"
    languages: [python]
    severity: ERROR

  # ── BLOCK DATABASE ────────────────────────────────────────────────────────

  - id: block-database
    pattern-either:
      - pattern: import sqlite3
      - pattern: from sqlite3 import $X
      - pattern: import sqlalchemy
      - pattern: from sqlalchemy import $X
      - pattern: sqlite3.connect($X, ...)
      - pattern: import psycopg2
      - pattern: from psycopg2 import $X
      - pattern: import psycopg
      - pattern: from psycopg import $X
      - pattern: import pymysql
      - pattern: from pymysql import $X
      - pattern: import mysql.connector
      - pattern: from mysql.connector import $X
      - pattern: import MySQLdb
      - pattern: from MySQLdb import $X
      - pattern: import pymssql
      - pattern: from pymssql import $X
      - pattern: import cx_Oracle
      - pattern: from cx_Oracle import $X
      - pattern: import oracledb
      - pattern: from oracledb import $X
      - pattern: import asyncpg
      - pattern: from asyncpg import $X
      - pattern: import aiomysql
      - pattern: from aiomysql import $X
      - pattern: import pyodbc
      - pattern: from pyodbc import $X
      - pattern: import duckdb
      - pattern: from duckdb import $X
      - pattern: import cassandra
      - pattern: from cassandra import $X
    message: "database / SQL drivers not allowed"
    languages: [python]
    severity: ERROR

  # ── BLOCK ARCHIVES ────────────────────────────────────────────────────────

  - id: block-archives
    pattern-either:
      - pattern: import zipfile
      - pattern: from zipfile import $X
      - pattern: import tarfile
      - pattern: from tarfile import $X
      - pattern: import gzip
      - pattern: from gzip import $X
      - pattern: import bz2
      - pattern: from bz2 import $X
      - pattern: import lzma
      - pattern: from lzma import $X
    message: "archives not allowed"
    languages: [python]
    severity: ERROR

  # ── BLOCK EXCEL LIBRARIES ─────────────────────────────────────────────────

  - id: block-excel-libraries
    pattern-either:
      - pattern: import openpyxl
      - pattern: from openpyxl import $X
      - pattern: import xlrd
      - pattern: from xlrd import $X
      - pattern: import xlwt
      - pattern: from xlwt import $X
      - pattern: import xlsxwriter
      - pattern: from xlsxwriter import $X
    message: "direct Excel libraries not allowed — use pd.read_excel/to_excel only"
    languages: [python]
    severity: ERROR

  # ── BLOCK LLM LIBRARIES ───────────────────────────────────────────────────

  - id: block-llm
    pattern-either:
      - pattern: import openai
      - pattern: from openai import $X
      - pattern: import anthropic
      - pattern: from anthropic import $X
      - pattern: import cohere
      - pattern: from cohere import $X
      - pattern: import mistralai
      - pattern: from mistralai import $X
      - pattern: import groq
      - pattern: from groq import $X
      - pattern: import together
      - pattern: from together import $X
      - pattern: import replicate
      - pattern: from replicate import $X
      - pattern: import huggingface_hub
      - pattern: from huggingface_hub import $X
      - pattern: import langchain
      - pattern: from langchain import $X
      - pattern: import langgraph
      - pattern: from langgraph import $X
      - pattern: import llama_index
      - pattern: from llama_index import $X
      - pattern: import vertexai
      - pattern: from vertexai import $X
    message: "LLM API calls not allowed"
    languages: [python]
    severity: ERROR

  # ── BLOCK KERAS ───────────────────────────────────────────────────────────

  - id: block-keras
    pattern-either:
      - pattern: import keras
      - pattern: from keras import $X
      - pattern: $MODEL.save($X, ...)
      - pattern: $MODEL.load_weights($X, ...)
      - pattern: $MODEL.save_weights($X, ...)
    message: "keras not allowed"
    languages: [python]
    severity: ERROR

  # ── BLOCK TENSORFLOW ──────────────────────────────────────────────────────

  - id: block-tensorflow
    pattern-either:
      - pattern: import tensorflow
      - pattern: from tensorflow import $X
      - pattern: tf.saved_model.save($X, ...)
      - pattern: tf.saved_model.load($X, ...)
      - pattern: tf.keras.models.load_model($X, ...)
    message: "tensorflow not allowed"
    languages: [python]
    severity: ERROR

  # ── BLOCK PYTORCH ─────────────────────────────────────────────────────────

  - id: block-pytorch
    pattern-either:
      - pattern: import torch
      - pattern: from torch import $X
      - pattern: import torchvision
      - pattern: from torchvision import $X
      - pattern: import torchaudio
      - pattern: from torchaudio import $X
      - pattern: torch.save($X, ...)
      - pattern: torch.load($X, ...)
      - pattern: torch.hub.load($X, ...)
    message: "pytorch not allowed"
    languages: [python]
    severity: ERROR

  # ── BLOCK TRANSFORMERS ────────────────────────────────────────────────────

  - id: block-transformers
    pattern-either:
      - pattern: import transformers
      - pattern: from transformers import $X
      - pattern: import diffusers
      - pattern: from diffusers import $X
      - pattern: import datasets
      - pattern: from datasets import $X
      - pattern: import accelerate
      - pattern: from accelerate import $X
    message: "huggingface libraries not allowed"
    languages: [python]
    severity: ERROR

  # ── BLOCK INTROSPECTION ───────────────────────────────────────────────────

  - id: block-introspection
    pattern-either:
      - pattern: globals()
      - pattern: locals()
      - pattern: vars()
      - pattern: __builtins__
      - pattern: __builtins__[$X]
      - pattern: __builtins__[...]
      - pattern: __builtins__.get(...)
    message: "introspection not allowed"
    languages: [python]
    severity: ERROR

  # ── BLOCK DUNDER ACCESS ───────────────────────────────────────────────────

  - id: block-dunder-access
    pattern-either:
      - pattern: $X.__class__
      - pattern: $X.__bases__
