# GaussianBlurr — models, middleware tuning, and workspace paths

models:
  orchestrator: "gpt-5.4-mini"
  code_generation: "gpt-5.4-mini"
  code_judge: "gpt-5.4-mini"
  summarization: "gpt-5.4-mini"

middleware:
  context_editing:
    keep_recent_messages: 10
  summarization:
    token_threshold: 100000
  tool_call_limit:
    max_calls: 25

code_pipeline:
  timeout_seconds: 120

skills:
  max_skill_context_tokens: 3000

paths:
  # On-disk: ./agent_filesystem/<session>/ — flat folder (uploads, outputs, pipeline_run.py)
  agent_filesystem: "agent_filesystem"

# When IS_NEON is true, graph checkpoints use Postgres (``DATABASE_URL`` in ``.env``). Otherwise ``InMemorySaver``.
checkpointer:
  IS_NEON: True
