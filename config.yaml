# GaussianBlurr — models, middleware tuning, and workspace paths

models:
  orchestrator: "gpt-4o-mini"
  code_generation: "gpt-4o-mini"
  code_judge: "gpt-4o-mini"
  summarization: "gpt-4o-mini"

middleware:
  context_editing:
    keep_recent_messages: 10
  summarization:
    token_threshold: 100000

code_pipeline:
  timeout_seconds: 120

skills:
  max_skill_context_tokens: 3000

paths:
  agent_filesystem: "agent_filesystem"
  sessions_root: "agent_sessions"
  input:     "agent_filesystem/input"
  output:    "agent_filesystem/output"
  processed: "agent_filesystem/processed"
  scratchpad: "agent_filesystem/scratchpad"
  code:      "agent_filesystem/code"
