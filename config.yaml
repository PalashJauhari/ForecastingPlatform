# Agentic Forecasting Platform — models, middleware tuning, and workspace paths

models:
  orchestrator: "gpt-5.4-mini"
  message_summarisation: "gpt-5.4-mini"

middleware:
  context_editing:
    keep_recent_messages: 10
  message_summarisation:
    token_threshold: 100000

graph:
  recursion_limit: 100
  max_concurrency: 2

llm_rate_limit:
  enabled: true
  requests_per_second: 1.0
  check_every_n_seconds: 0.1
  max_bucket_size: 5.0

paths:
  agent_filesystem: "agent_filesystem"

observability:
  langfuse_tracing_enabled: false  # overridden by LANGFUSE_TRACING_ENABLED env

checkpointer:
  use_neon: false
