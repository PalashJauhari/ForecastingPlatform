[project]
name = "gaussianblurr"
version = "0.1.0"
description = "Agentic forecasting platform — LangGraph orchestration, deterministic forecast tools, sandboxed coding."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Palash Jauhari" }]
keywords = ["forecasting", "langgraph", "agents", "time-series"]

# Install runtime deps via: pip install -r requirements.txt
# (kept as requirements.txt so start.sh / CI stay simple).

[project.urls]
Repository = "https://github.com/PalashJauhari/ForecastingPlatform"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/unit"]
addopts = "-q"
asyncio_mode = "auto"
